<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Rising Dreams Form</title></head>
  <body>
    <form name="rising-dreams-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rising-dreams-interest" />
      <input name="bot-field" />
      <input name="first-name" />
      <input name="last-name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="checkbox" name="interests" value="Registering a young artist" />
      <input type="checkbox" name="interests" value="Volunteering" />
      <input type="checkbox" name="interests" value="Teaching a skill" />
      <input type="checkbox" name="interests" value="Becoming a sponsor" />
      <input type="checkbox" name="interests" value="Donating supplies" />
      <input type="checkbox" name="interests" value="Community partnership" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
